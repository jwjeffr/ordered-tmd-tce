[project]
name = "ordered-tmd-tce"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ase>=3.25.0",
    "cowley-sro-parameters>=2.0.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "ovito>=3.14.1",
    "pathos>=0.3.5",
    "pillow>=12.3.0",
    "pyside6-essentials==6.8.3",
    "scikit-learn>=1.9.0",
    "tce-lib>=1.0.3",
    "tce-modifier",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
tce-modifier = { git = "https://github.com/jwjeffr/tce-modifier.git" }
